<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>দোকানের হিসাব</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f5;--card:#fff;--tx:#10151c;--mut:#5b6573;--line:#dde2e9;--inc:#0f7a49;--exp:#c23a2b;--own:#1c5fc4;--ink:#10151c;--inkt:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1217;--card:#181e26;--tx:#eef1f5;--mut:#98a3b2;--line:#2a323d;--inc:#3fd08f;--exp:#ff7c6b;--own:#78adff;--ink:#eef1f5;--inkt:#0e1217}}
:root[data-theme="dark"]{--bg:#0e1217;--card:#181e26;--tx:#eef1f5;--mut:#98a3b2;--line:#2a323d;--inc:#3fd08f;--exp:#ff7c6b;--own:#78adff;--ink:#eef1f5;--inkt:#0e1217}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Noto Sans Bengali","Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:520px;margin:0 auto;padding:14px}
h2{font-size:20px;margin:6px 0 12px}
h3{margin:0 0 12px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}
.inc{color:var(--inc)}.exp{color:var(--exp)}.own{color:var(--own)}
.big{font-size:40px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:12px 0 8px;background:var(--line)}
.bar i{display:block;height:100%}
.leg{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.leg b{display:block;font-size:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.g2 .card{margin:0;padding:12px}
.g2 b{font-size:20px;display:block}
.jobs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
.jb{min-height:62px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:600;font-size:14px;padding:6px 2px}
.jb:active{background:var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.big2{min-height:54px;border-radius:12px;border:2px solid;background:var(--card);font-weight:700}
.pri{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ink);color:var(--inkt);font-weight:700;margin-top:10px}
.sec{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:8px}
input,select,textarea{width:100%;min-height:48px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:4px 0 10px}
label{display:block;font-size:13px;color:var(--mut)}
textarea{min-height:120px;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 12px}
.seg button{min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px}
.seg button.on{background:var(--ink);color:var(--inkt);border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row.vd{opacity:.45;text-decoration:line-through}
.d{width:10px;height:36px;border-radius:5px;flex:none}
.d.inc{background:var(--inc)}.d.exp{background:var(--exp)}.d.own{background:var(--own)}
.rm{flex:1;min-width:0}.rm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm small{color:var(--mut)}
.ra{text-align:right}.ra em{display:block;font-style:normal;font-size:12px;color:var(--mut)}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.chips button{flex:none;min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:19px;background:var(--card)}
.chips button.on{background:var(--ink);color:var(--inkt);border-color:var(--ink)}
.ln{display:flex;justify-content:space-between;padding:6px 0}
hr{border:0;border-top:1px solid var(--line);margin:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-height:60px;border:0;background:none;font-size:13px;color:var(--mut)}
nav button.on{color:var(--tx);font-weight:700;box-shadow:inset 0 3px 0 var(--ink)}
#sh{display:none;position:fixed;inset:0;z-index:9}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.pn{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--inkt);padding:10px 16px;border-radius:10px;z-index:20;display:none}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.card{border-radius:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 14px}
.top small{color:var(--mut);display:block}
.top h1{margin:0;font-size:24px;letter-spacing:-.3px}
.wk{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 10px;color:var(--mut)}
.hero{background:linear-gradient(145deg,#0f2b57,#1c5fc4 62%,#2b8ddb);color:#fff;border:0;border-radius:22px;padding:20px;box-shadow:0 10px 24px rgba(28,95,196,.28)}
.hero .mut{color:rgba(255,255,255,.8)}
.hero .bar{background:rgba(255,255,255,.22);height:14px;border-radius:7px}
.hero .own{color:#ffd166}
.hero .big{font-size:46px}
.sl{font-size:14px;color:var(--mut);margin:4px 2px 8px;font-weight:600}
.jb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:80px;border-radius:16px;transition:transform .1s}
.jb:active{transform:scale(.95)}
.ic{font-size:24px;line-height:1;width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--bg)}
.big2{border-radius:16px;border:0;color:#fff;min-height:56px;font-size:16px;transition:transform .1s}
.big2:active{transform:scale(.97)}
.bx{background:#d64533}.bo{background:#1c5fc4}
nav{border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.1)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button.on{box-shadow:none}
.ni{font-size:20px;line-height:1;padding:3px 16px;border-radius:14px}
nav button.on .ni{background:var(--bg)}
.pn{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.pn{animation:none}}
</style>
</head>
<body>
<main id="v"></main>
<nav id="nv"></nav>
<div id="sh"></div>
<div id="toast"></div>
<script>
var K='cafe_v1',S,M,armed=0,filt='all',tab='home',saveOk=true;
var J=[['print','প্রিন্ট',2,1],['copy','ফটোকপি',1,1],['form','অনলাইন ফর্ম',50,0],['photo','ফটো',30,0],['type','টাইপিং',20,1],['scan','স্ক্যান',10,1],['rech','রিচার্জ',0,0],['oth','অন্যান্য',0,0]];
var IC={print:'🖨️',copy:'📄',form:'📝',photo:'📷',type:'⌨️',scan:'🖼️',rech:'📱',oth:'➕'};
var EC=['কাগজ','কালি/টোনার','বিদ্যুৎ','ভাড়া','মেরামত','চা-নাস্তা','অন্যান্য'];
var HC=['টাকা ট্রান্সফার','রিচার্জ','বিদ্যুৎ বিল','অন্যান্য'];
var $=function(s){return document.querySelector(s)};
var fmt=function(n){return '₹'+Math.round(n).toLocaleString('en-IN')};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var tm=function(t){return new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})};
var dt=function(t){return new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short'})};
function fresh(){var r={};J.forEach(function(j){r[j[0]]=j[2]});return{week:{start:Date.now(),open:20000},entries:[],hist:[],rates:r}}
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}
 if(!S||!S.week||!Array.isArray(S.entries)){S=fresh()}
 S.hist=S.hist||[];S.rates=S.rates||fresh().rates}
function save(){try{localStorage.setItem(K,JSON.stringify(S));saveOk=true}catch(e){saveOk=false}}
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},2200)}
function calc(){var jc=0,ju=0,ex=0,hm=0,td=0,du=0,now=new Date().toDateString();
 S.entries.forEach(function(x){if(x.v)return;
  if(x.t=='job'&&x.due)du+=x.a;
  if(x.ts<S.week.start||x.due)return;
  if(x.t=='job'){if(x.p=='upi')ju+=x.a;else jc+=x.a;if(new Date(x.ts).toDateString()==now)td+=x.a}
  else if(x.t=='exp')ex+=x.a;else if(x.t=='home')hm+=x.a});
 var dr=S.week.open+jc-ex+hm;return{jc:jc,ju:ju,ex:ex,hm:hm,td:td,du:du,dr:dr,mine:dr-hm}}
function vHome(){var c=calc(),tot=Math.max(c.dr,1),mp=Math.max(0,c.mine)/tot*100,op=Math.max(0,c.hm)/tot*100;
 return '<div class=top><div><small>সাইবার ক্যাফে · ক্যাশ খাতা</small><h1>দোকানের হিসাব</h1></div><div class=wk>সপ্তাহ: '+dt(S.week.start)+'</div></div><div class="card hero"><div class=mut>ড্রয়ারে মোট ক্যাশ</div><div class=big>'+fmt(c.dr)+'</div>'
 +'<div class=bar><i style="width:'+mp+'%;background:#fff"></i><i style="width:'+op+'%;background:#ffd166"></i></div>'
 +'<div class=leg><span>আপনার অংশ<b>'+fmt(c.mine)+'</b></span><span class=own style="text-align:right">বাবুর টাকা<b>'+fmt(c.hm)+'</b></span></div></div>'
 +'<div class=g2><div class=card><span class=mut>আজকের কাজের আয়</span><b class=inc>'+fmt(c.td)+'</b></div><div class=card><span class=mut>এই সপ্তাহে খরচ</span><b class=exp>'+fmt(c.ex)+'</b></div>'
 +'<div class=card><span class=mut>UPI-তে পাওয়া</span><b>'+fmt(c.ju)+'</b></div><div class=card><span class=mut>বাকি আছে</span><b>'+fmt(c.du)+'</b></div></div>'
 +'<div class=sl>নতুন কাজ যোগ করুন</div><div class=jobs>'+J.map(function(j){return '<button class=jb data-a=job data-v='+j[0]+'><span class=ic>'+IC[j[0]]+'</span>'+j[1]+'</button>'}).join('')+'</div>'
 +'<div class=two><button class="big2 bx" data-a=exp>− খরচ</button><button class="big2 bo" data-a=home>বাবুর পাঠানো টাকা</button></div>'
 +(saveOk?'':'<p class=mut>ফোনে ডেটা সেভ হচ্ছে না। সেটিংসে গিয়ে ব্যাকআপ কপি করে রাখুন।</p>')}
function row(x){var col={job:'inc',exp:'exp',home:'own'}[x.t],sg=x.t=='exp'?'−':'+';
 return '<div class="row'+(x.v?' vd':'')+'" data-a=open data-v='+x.id+'><i class="d '+col+'"></i><div class=rm><b>'+esc(x.c)+(x.nm?' · '+esc(x.nm):'')+'</b><small>'+tm(x.ts)+(x.note?' · '+esc(x.note):'')+'</small></div><div class=ra><b class='+col+'>'+sg+fmt(x.a)+'</b>'+(x.due?'<em>বাকি</em>':x.p=='upi'?'<em>UPI</em>':'')+'</div></div>'}
function vList(){var L=S.entries.filter(function(x){return(x.ts>=S.week.start||(x.due&&!x.v))&&(filt=='all'||x.t==filt)}).sort(function(a,b){return b.ts-a.ts});
 var f=[['all','সব'],['job','কাজ'],['exp','খরচ'],['home','বাবুর টাকা']];
 return '<h2>এই সপ্তাহের এন্ট্রি</h2><div class=chips>'+f.map(function(c){return '<button class="'+(filt==c[0]?'on':'')+'" data-a=filt data-v='+c[0]+'>'+c[1]+'</button>'}).join('')+'</div>'
 +'<div class=card>'+(L.length?L.map(row).join(''):'<div class=empty>এখনো কোনো এন্ট্রি নেই। হোম থেকে প্রথম কাজটি যোগ করুন।</div>')+'</div>'}
function ln(l,v,c){return '<div class=ln><span>'+l+'</span><b class="'+(c||'')+'">'+(v<0?'−':'')+fmt(Math.abs(v))+'</b></div>'}
function summary(){var c=calc();return 'সপ্তাহ: '+dt(S.week.start)+' থেকে '+dt(Date.now())+'\nবরাদ্দ: '+fmt(S.week.open)+'\nকাজ থেকে ক্যাশ আয়: '+fmt(c.jc)+'\nUPI-তে পাওয়া: '+fmt(c.ju)+'\nখরচ: '+fmt(c.ex)+'\nবাবুর পাঠানো টাকা: '+fmt(c.hm)+'\nড্রয়ারে থাকার কথা: '+fmt(c.dr)+'\nবাকি: '+fmt(c.du)}
function vSet(){var c=calc();
 return '<h2>শনিবারের সেটেলমেন্ট</h2><div class=card>'+ln('সপ্তাহের শুরুতে বরাদ্দ',S.week.open)+ln('কাজ থেকে ক্যাশ আয়',c.jc,'inc')+ln('খরচ',-c.ex,'exp')+ln('বাবুর পাঠানো টাকা',c.hm,'own')+'<hr>'+ln('ড্রয়ারে থাকার কথা',c.dr)+'</div>'
 +'<div class=card><label>আসল ক্যাশ গুনে লিখুন<input id=act type=number inputmode=decimal></label><div id=dif class=mut></div>'
 +'<label>নতুন সপ্তাহের বরাদ্দ<input id=nf type=number inputmode=decimal value='+S.week.open+'></label>'
 +'<button class=pri data-a=settle id=stb>সেটেলমেন্ট শেষ, নতুন সপ্তাহ শুরু</button></div>'
 +'<div class=card><b>বাবুকে দেখানোর সারাংশ</b><textarea id=out readonly>'+esc(summary())+'</textarea><button class=sec data-a=copy>কপি করুন</button></div>'
 +(S.hist.length?'<h2>আগের সপ্তাহ</h2><div class=card>'+S.hist.slice(-8).reverse().map(function(h){return '<div class=row><div class=rm><b>'+dt(h.start)+' – '+dt(h.end)+'</b><small>বাবুর টাকা '+fmt(h.hm)+'</small></div><div class=ra><b class="'+(h.diff==null||h.diff==0?'':h.diff<0?'exp':'inc')+'">'+(h.diff==null?'গোনা হয়নি':h.diff==0?'ঠিক আছে':(h.diff<0?'কম ':'বেশি ')+fmt(Math.abs(h.diff)))+'</b></div></div>'}).join('')+'</div>':'')}
function vCfg(){return '<h2>সেটিংস</h2><div class=card><b>কাজের রেট</b><p class=mut>যে কাজে পাতার সংখ্যা লাগে সেখানে রেট × সংখ্যা নিজে হিসাব হবে।</p>'
 +J.map(function(j){return '<label>'+j[1]+(j[3]?' (₹ প্রতি পাতা/কপি)':' (₹ ফ্ল্যাট)')+'<input data-r='+j[0]+' type=number inputmode=decimal value='+(S.rates[j[0]]||0)+'></label>'}).join('')+'</div>'
 +'<div class=card><b>ব্যাকআপ</b><p class=mut>ফোন বদলালে বা ব্রাউজার ডেটা মুছলে হিসাব হারাতে পারে। মাঝে মাঝে ব্যাকআপ কপি করে WhatsApp-এ নিজেকে পাঠিয়ে রাখুন।</p><textarea id=bk placeholder="এখানে ব্যাকআপ আসবে বা পেস্ট করুন"></textarea>'
 +'<button class=sec data-a=bk>ব্যাকআপ কপি</button><button class=sec data-a=rs>ব্যাকআপ থেকে ফিরিয়ে আনুন</button></div>'}
function r(){var T=[['home','হোম','🏠'],['list','এন্ট্রি','🧾'],['set','সেটেলমেন্ট','🤝'],['cfg','সেটিংস','⚙️']];
 $('#v').innerHTML={home:vHome,list:vList,set:vSet,cfg:vCfg}[tab]();
 $('#nv').innerHTML=T.map(function(t){return '<button class="'+(tab==t[0]?'on':'')+'" data-a=tab data-v='+t[0]+'><span class=ni>'+t[2]+'</span>'+t[1]+'</button>'}).join('');window.scrollTo(0,0)}
function sheet(h){$('#sh').innerHTML='<div class=bk data-a=close></div><div class=pn>'+h+'</div>';$('#sh').style.display='block'}
function fld(id,l,ph,num){return '<label>'+l+'<input id='+id+(num?' type=number inputmode=decimal':' type=text')+' placeholder="'+(ph||'')+'"></label>'}
function openE(t,c){M={t:t,c:c,p:'cash'};var j=J.filter(function(x){return x[0]==c})[0],h='';
 if(t=='job'){M.c=j[1];var rt=S.rates[c]||0;h='<h3>'+j[1]+'</h3>';if(j[3]&&rt)h+=fld('qty','সংখ্যা (রেট '+fmt(rt)+')','',1);M.rt=j[3]&&rt?rt:0;
  h+=fld('amt','টাকা','',1)+'<label>পেমেন্ট</label><div class=seg id=pay><button class=on data-a=pay data-v=cash>ক্যাশ</button><button data-a=pay data-v=upi>UPI</button><button data-a=pay data-v=due>বাকি</button></div>'+fld('nm','কাস্টমারের নাম (ঐচ্ছিক)')}
 else{var L=t=='exp'?EC:HC;h='<h3>'+(t=='exp'?'খরচ':'বাবুর পাঠানো টাকা (বাবু পাঠালেন, ক্যাশ আপনার ড্রয়ারে)')+'</h3>'+fld('amt','টাকা','',1)+'<label>ধরন<select id=cat>'+L.map(function(x){return '<option>'+x+'</option>'}).join('')+'</select></label>'+fld('nm',t=='exp'?'কাকে দেওয়া (ঐচ্ছিক)':'কাস্টমারের নাম')}
 sheet(h+fld('nt','নোট (ঐচ্ছিক)')+'<button class=pri data-a=save>সেভ করুন</button>');setTimeout(function(){var e=$(M.rt?'#qty':'#amt');e&&e.focus()},50)}
var ACT={
 tab:function(v){tab=v;armed=0;r()},
 filt:function(v){filt=v;r()},
 job:function(v){openE('job',v)},exp:function(){openE('exp')},home:function(){openE('home')},
 close:function(){$('#sh').style.display='none'},
 pay:function(v){M.p=v;document.querySelectorAll('#pay button').forEach(function(b){b.className=b.dataset.v==v?'on':''})},
 save:function(){var a=parseFloat($('#amt').value);if(!(a>0)){toast('টাকার পরিমাণ লিখুন');return}
  var x={id:Date.now()+Math.random().toString(36).slice(2,5),ts:Date.now(),t:M.t,c:M.t=='job'?M.c:$('#cat').value,a:a,p:M.p=='upi'?'upi':'cash',due:M.p=='due'?1:0,nm:$('#nm').value.trim(),note:$('#nt').value.trim(),v:0};
  S.entries.push(x);save();ACT.close();r();toast('সেভ হয়েছে: '+fmt(a))},
 open:function(id){var x=S.entries.filter(function(e){return e.id==id})[0];if(!x)return;M={id:id};
  sheet('<h3>'+esc(x.c)+' · '+fmt(x.a)+'</h3><p class=mut>'+tm(x.ts)+(x.nm?' · '+esc(x.nm):'')+(x.note?'<br>'+esc(x.note):'')+'</p>'
  +(x.due&&!x.v?'<button class=pri data-a=pd>বাকি পরিশোধ হয়েছে (ক্যাশ)</button>':'')
  +'<button class=sec data-a='+(x.v?'unv':'vd')+'>'+(x.v?'বাতিল ফিরিয়ে আনুন':'এন্ট্রি বাতিল করুন')+'</button>')},
 pd:function(){S.entries.forEach(function(e){if(e.id==M.id){e.due=0;e.p='cash';e.ts=Date.now()}});save();ACT.close();r();toast('পরিশোধ হয়েছে')},
 vd:function(){S.entries.forEach(function(e){if(e.id==M.id)e.v=1});save();ACT.close();r();toast('বাতিল হয়েছে')},
 unv:function(){S.entries.forEach(function(e){if(e.id==M.id)e.v=0});save();ACT.close();r()},
 copy:function(){var o=$('#out');o.select();try{navigator.clipboard.writeText(o.value);toast('কপি হয়েছে')}catch(e){toast('লেখাটি চেপে ধরে কপি করুন')}},
 settle:function(){var b=$('#stb');if(!armed){armed=1;b.textContent='নিশ্চিত করতে আবার চাপুন';setTimeout(function(){armed=0;var q=$('#stb');if(q)q.textContent='সেটেলমেন্ট শেষ, নতুন সপ্তাহ শুরু'},4000);return}
  var c=calc(),av=$('#act').value,nf=parseFloat($('#nf').value);
  S.hist.push({start:S.week.start,end:Date.now(),open:S.week.open,hm:c.hm,jc:c.jc,ex:c.ex,expected:c.dr,diff:av===''?null:parseFloat(av)-c.dr});
  S.week={start:Date.now(),open:nf>=0?nf:0};armed=0;save();r();toast('নতুন সপ্তাহ শুরু')},
 bk:function(){var t=$('#bk');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value);toast('ব্যাকআপ কপি হয়েছে')}catch(e){toast('লেখাটি কপি করে রাখুন')}},
 rs:function(){try{var d=JSON.parse($('#bk').value);if(!d.week||!Array.isArray(d.entries))throw 0;S=d;S.hist=S.hist||[];S.rates=S.rates||fresh().rates;save();r();toast('ফিরিয়ে আনা হয়েছে')}catch(e){toast('ব্যাকআপ লেখাটি ঠিক নেই')}}
};
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset.v)});
document.addEventListener('input',function(ev){var e=ev.target;
 if(e.id=='qty'&&M&&M.rt){var q=parseFloat(e.value);$('#amt').value=q>0?q*M.rt:''}
 if(e.id=='act'){var c=calc(),v=parseFloat(e.value),d=$('#dif');d.innerHTML=isNaN(v)?'':v==c.dr?'<b class=inc>হিসাব ঠিক আছে</b>':v<c.dr?'<b class=exp>কম আছে '+fmt(c.dr-v)+'</b>':'<b class=own>বেশি আছে '+fmt(v-c.dr)+'</b>'}
 if(e.dataset&&e.dataset.r){S.rates[e.dataset.r]=parseFloat(e.value)||0;save()}});
load();save();r();
</script>
</body>
</html>
