onAuthStateChanged(au,u=>{un.forEach(f=>f());un=[];window.fbAuth(u);if(u)['h_entries','h_meta','h_hist','h_svc'].forEach(c=>un.push(onSnapshot(collection(fs,'shops','main',c),sn=>window.fbSnap(c,sn.docs.map(d=>d.data())),e=>window.fbErr(e.code))))})}
