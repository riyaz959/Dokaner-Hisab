<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Noto Sans Bengali","Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:520px;margin:0 auto;padding:14px}
h2{font-size:20px;margin:6px 0 12px}
h3{margin:0 0 12px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}
.inc{color:var(--inc)}.exp{color:var(--exp)}.own{color:var(--own)}

button{font:inherit;color:inherit;cursor:pointer}
.jb{min-height:62px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:600;font-size:14px;padding:6px 2px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.big2{min-height:54px;border-radius:12px;border:2px solid;background:var(--card);font-weight:700}
.pri{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ink);color:var(--inkt);font-weight:700;margin-top:10px}

.row{display:flex;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}

.d{width:10px;height:36px;border-radius:5px;flex:none}
.d.inc{background:var(--inc)}.d.exp{background:var(--exp)}.d.own{background:var(--own)}
.rm{flex:1;min-width:0}.rm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm small{color:var(--mut)}
.ra{text-align:right}.ra em{display:block;font-style:normal;font-size:12px;color:var(--mut)}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}

.ln{display:flex;justify-content:space-between;padding:6px 0}
hr{border:0;border-top:1px solid var(--line);margin:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}

.bk{position:absolute;inset:0;background:rgba(0,0,0,.5)}

.empty{text-align:center;color:var(--mut);padding:24px 8px}
.card{border-radius:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 14px}
.top small{color:var(--mut);display:block}
.top h1{margin:0;font-size:24px;letter-spacing:-.3px}
.wk{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 10px;color:var(--mut)}
.hero{background:linear-gradient(145deg,#050505,#1f1a08 65%,#3d3009);color:#f6e7b0;border:1px solid #c9a227;border-radius:22px;padding:20px;box-shadow:0 10px 24px rgba(201,162,39,.25)}
.hero .mut{color:rgba(255,255,255,.8)}
.hero .bar{background:rgba(255,255,255,.22);height:14px;border-radius:7px}
.hero .own{color:#ffd166}
.hero .big{font-size:46px}
.sl{font-size:14px;color:var(--mut);margin:4px 2px 8px;font-weight:600}
.jb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:80px;border-radius:16px;transition:transform .1s}
.jb:active{transform:scale(.95)}
.ic{font-size:24px;line-height:1;width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--bg)}
.big2{border-radius:16px;border:0;color:#fff;min-height:56px;font-size:16px;transition:transform .1s}
.big2:active{transform:scale(.97)}
.bx{background:#d64533}.bo{background:#1c5fc4}
nav{border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.1)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button.on{box-shadow:none}
.ni{font-size:20px;line-height:1;padding:3px 16px;border-radius:14px}
nav button.on .ni{background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px}.lg{width:48px;height:48px;border-radius:50%;border:1px solid #c9a227}
.pn{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.pn{animation:none}}
.jb{font-size:13px;text-align:center;line-height:1.2}.jb small{display:block;font-size:11px;color:var(--mut);font-weight:400}
.sv{display:grid;grid-template-columns:1fr 78px 62px 44px;gap:6px;align-items:center}.sv input{margin:2px 0;min-width:0}
.sec.sm{margin:0;min-height:44px;padding:0 2px;font-size:13px;width:100%}
.dash{display:block}
@media(min-width:900px){
body{padding-bottom:0;padding-top:60px}
main{max-width:760px;padding:22px 28px}main.wide{max-width:1240px}
nav{top:0;bottom:auto;border-radius:0;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:6px;box-shadow:none}
nav button{flex:none;flex-direction:row;gap:8px;min-height:56px;padding:0 24px;font-size:15px}
nav button.on{box-shadow:inset 0 -3px 0 var(--ink)}
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:22px;align-items:start}
.jobs{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.pn{top:50%;bottom:auto;transform:translateY(-50%);border-radius:18px;max-width:480px;animation:none;max-height:86%}
}
</style>

<script>
var K='cafe_v1',S,M,armed=0,filt='all',tab='home',saveOk=true;

function idb(){return new Promise(function(res){try{var q=indexedDB.open('luraHisab',1);q.onupgradeneeded=function(){q.result.createObjectStore('kv')};q.onsuccess=function(){res(q.result)};q.onerror=function(){res(null)}}catch(e){res(null)}})}
var DEF=[['প্রিন্ট',2,1,'🖨️','print'],['কালার প্রিন্ট',0,1,'🎨'],['ফটোকপি',1,1,'📄','copy'],['স্ক্যান',10,1,'🖼️','scan'],['লেমিনেশন',0,0,'🧷'],['অনলাইন ফর্ম',50,0,'📝','form'],['আধার সেবা',0,0,'🪪'],['প্যান কার্ড',0,0,'💳'],['রেশন কার্ড',0,0,'🍚'],['ভোটার কার্ড',0,0,'🗳️'],['পাসপোর্ট/ভিসা',0,0,'🛂'],['ফটো',30,0,'📷','photo'],['টাইপিং',20,1,'⌨️','type'],['মোবাইল রিচার্জ',0,0,'📱'],['DTH রিচার্জ',0,0,'📺'],['বিদ্যুৎ বিল',0,0,'💡'],['ট্রেন টিকিট',0,0,'🚆'],['বাস/ফ্লাইট টিকিট',0,0,'🚌'],['জন্ম/মৃত্যু সনদ',0,0,'👶'],['জাতি/আয়/বাসিন্দা সনদ',0,0,'📜'],['স্বাস্থ্যসাথী',0,0,'🏥'],['সরকারি প্রকল্প ফর্ম',0,0,'🏛️'],['চাকরির আবেদন',0,0,'💼'],['ব্যাংক/KYC কাজ',0,0,'🏦'],['ইমেইল/আইডি তৈরি',0,0,'✉️'],['অন্যান্য',0,0,'➕','oth']];
function norm(){if(!S||!S.week||!Array.isArray(S.entries))S=fresh();S.hist=S.hist||[];S.rates=S.rates||fresh().rates;S.u=S.u||'';
 if(!Array.isArray(S.svc))S.svc=DEF.map(function(d,i){var r=d[4]&&S.rates[d[4]]!=null?S.rates[d[4]]:d[1];return{id:'d'+i,n:d[0],r:r,u:d[2],i:d[3]}})}
function load(){return idb().then(function(d){DB=d;if(!d)return null;return new Promise(function(res){try{var g=d.transaction('kv').objectStore('kv').get('S');g.onsuccess=function(){res(g.result)};g.onerror=function(){res(null)}}catch(e){res(null)}})}).then(function(d){if(!d)try{d=JSON.parse(localStorage.getItem(K))}catch(e){}S=d;norm();save()})}
function save(){var ok=0;try{localStorage.setItem(K,JSON.stringify(S));ok=1}catch(e){}if(DB)try{DB.transaction('kv','readwrite').objectStore('kv').put(S,'S');ok=1}catch(e){}saveOk=!!ok}
function fbp(c,o){if(RM||!window.FB2||!FBU)return;FB2.push(c,o).catch(function(e){lastSync='⚠️ '+(e.code||e)})}
function ch(x){x.u=now();save();fbp('h_entries',x)}
function chM(){S.u=now();save();fbp('h_meta',{id:'cfg',u:S.u,week:S.week,rates:S.rates,svc:S.svc})}
window.fbAuth=function(u){FBU=u;lastSync=u?'':lastSync;if(S&&tab=='cfg')r()};
window.fbErr=function(e){lastSync='⚠️ '+e;if(S&&tab=='cfg')r()};
window.fbSnap=function(c,rem){if(!S){setTimeout(function(){window.fbSnap(c,rem)},200);return}
 var chg=0,m={};rem.forEach(function(x){m[x.id]=x});RM=1;
 try{if(c=='h_entries'){rem.forEach(function(x){var l=S.entries.filter(function(e){return e.id==x.id})[0];if(!l){S.entries.push(x);chg=1}else if((x.u||'')>(l.u||'')){Object.assign(l,x);chg=1}})}
 else if(c=='h_hist'){rem.forEach(function(x){if(!S.hist.some(function(h){return h.start==x.start})){S.hist.push(x);chg=1}})}
 else{var g=m.cfg;if(g&&(g.u||'')>(S.u||'')){S.week=g.week;S.rates=g.rates;if(g.svc)S.svc=g.svc;S.u=g.u;chg=1}}}finally{RM=0}
 if(chg){save();r()}
 if(c=='h_entries')S.entries.forEach(function(e){var x=m[e.id];if(!e.u)e.u=new Date(e.ts).toISOString();if(!x||e.u>(x.u||''))fbp(c,e)});
 else if(c=='h_hist')S.hist.forEach(function(h){h.id=''+h.start;if(!m[h.id])fbp(c,h)});
 else{var g2=m.cfg;if(!g2||(S.u||'')>(g2.u||''))fbp(c,{id:'cfg',u:S.u||now(),week:S.week,rates:S.rates,svc:S.svc})}
 lastSync='শেষ সিঙ্ক: '+new Date().toLocaleTimeString('en-IN');if(tab=='cfg')r()};
function dl(n,t,m){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m||'application/json'}));a.download=n;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)}
function bkWarn(){var t=0;try{t=localStorage.getItem('lastBkISO')}catch(e){}var old=!t||(Date.now()-new Date(t))>7*864e5;return old?'<div class=card style="border-color:#ef4444"><b style="color:#ef4444">⚠️ '+(t?'৭ দিনের বেশি ব্যাকআপ নেওয়া হয়নি':'এখনো ব্যাকআপ নেওয়া হয়নি')+'</b><button class=sec data-a=tab data-v=cfg>💾 ব্যাকআপ নিন</button></div>':''}
function syBox(){return '<div class=card><b>☁️ অটো সিঙ্ক (Firebase)</b><p class=mut>'+(FBU?'✅ চালু: '+esc(FBU.email)+'. প্রতিটি পরিবর্তন ফোন ও কম্পিউটারে নিজে থেকে মিলে যায়।':window.FB2?'লগইন করা নেই।':'config.js পাওয়া যায়নি, তাই সিঙ্ক বন্ধ। হিসাব শুধু এই ডিভাইসে আছে।')+(lastSync?'<br>'+esc(lastSync):'')+'</p>'+(FBU?'<button class=sec data-a=so>লগআউট</button>':window.FB2?'<button class=pri data-a=si>Google দিয়ে লগইন</button>':'')+'</div>'}
function imp(f){if(!f)return;f.text().then(function(t){var j;try{j=JSON.parse(t);if(j.app!='lura-hisab'||!j.data||!Array.isArray(j.data.entries))throw 0}catch(e){return toast('ব্যাকআপ ফাইল ঠিক নেই')}
 var nw=[],same=0,cf=0;j.data.entries.forEach(function(r){if(!r||typeof r.id!='string')return;var o=S.entries.filter(function(e){return e.id==r.id})[0];if(!o)nw.push(r);else if(JSON.stringify(o)==JSON.stringify(r))same++;else cf++});
 if(!confirm('নতুন: '+nw.length+' · একই (বাদ): '+same+' · গরমিল (পুরনোটা থাকবে): '+cf+'\nকিছু মুছবে না। ইম্পোর্ট করবেন?'))return;
 nw.forEach(function(r){r.u=r.u||now();S.entries.push(r);fbp('h_entries',r)});
 (j.data.hist||[]).forEach(function(h){if(!S.hist.some(function(x){return x.start==h.start}))S.hist.push(h)});
 save();r();toast('ইম্পোর্ট হয়েছে: '+nw.length+'টি নতুন')})}
document.addEventListener('change',function(ev){if(ev.target.id=='rf'){imp(ev.target.files[0]);ev.target.value=''}});

function calc(){var jc=0,ju=0,ex=0,hm=0,td=0,du=0,now=new Date().toDateString();

  if(x.t=='job'&&x.due)du+=x.a;

  else if(x.t=='exp')ex+=x.a;else if(x.t=='home')hm+=x.a});
 var dr=S.week.open+jc-ex+hm;return{jc:jc,ju:ju,ex:ex,hm:hm,td:td,du:du,dr:dr,mine:dr-hm}}
function jgrid(){var q=(window.SQ||'').toLowerCase();var L=S.svc.filter(function(s){return!q||s.n.toLowerCase().indexOf(q)>=0});return L.length?L.map(function(s){return '<button class=jb data-a=job data-v='+s.id+'><span class=ic>'+s.i+'</span>'+esc(s.n)+(s.r?'<small>'+fmt(s.r)+(s.u?'/পাতা':'')+'</small>':'')+'</button>'}).join(''):'<div class=empty style="grid-column:1/-1">এই নামে সার্ভিস নেই। সেটিংসে যোগ করুন।</div>'}
